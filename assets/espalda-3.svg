<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradE3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="shadowE3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7f1d1d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    @keyframes animLumbarExtend {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(7deg); }
    }
    .lumbar-extend {
      transform-origin: 140px 145px;
      animation: animLumbarExtend 3.5s ease-in-out infinite;
    }
  </style>

  <rect width="320" height="200" rx="16" fill="url(#bgGradE3)"/>

  <!-- Silla -->
  <line x1="100" y1="145" x2="200" y2="145" stroke="#991b1b" stroke-width="5" stroke-linecap="round"/>
  <line x1="145" y1="145" x2="145" y2="185" stroke="#7f1d1d" stroke-width="5" stroke-linecap="round"/>

  <!-- Muslos y rodillas apoyados -->
  <path d="M145 142 L205 142 L210 185" fill="none" stroke="#450a0a" stroke-width="12" stroke-linecap="round"/>

  <!-- Columna en extensión suave y controlada (animada) -->
  <g class="lumbar-extend">
    <path d="M140 142 C132 120 135 95 148 72" stroke="#450a0a" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Cadena anterior (Psoas) en rojo terapéutico -->
    <path d="M142 135 Q135 115 145 85" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
    <circle cx="138" cy="115" r="3.5" fill="#fca5a5"/>

    <!-- Cabeza erguida con esternón elevado -->
    <ellipse cx="156" cy="56" rx="16" ry="19" fill="#1c1917" filter="url(#shadowE3)"/>

    <!-- Manos en sacro para soporte biomecánico -->
    <path d="M142 90 L125 105 L132 132" fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="132" cy="132" r="5" fill="#991b1b"/>

    <!-- Codos hacia atrás -->
    <path d="M125 105 L110 115" stroke="#991b1b" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Flecha de apertura de tórax y extensión -->
  <path d="M125 75 Q145 60 165 70" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,2"/>
  <polygon points="163,65 170,71 163,77" fill="#dc2626"/>

  <!-- Badges clínicos -->
  <g transform="translate(16, 16)">
    <rect width="150" height="24" rx="12" fill="#ffffff" opacity="0.96" filter="url(#shadowE3)"/>
    <circle cx="14" cy="12" r="5" fill="#dc2626"/>
    <text x="25" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Apertura Cadera & Lumbar</text>
  </g>

  <g transform="translate(168, 162)">
    <rect width="138" height="22" rx="11" fill="#dc2626" opacity="0.95"/>
    <text x="69" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Animación: Abrir Pecho</text>
  </g>
</svg>
