<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradE3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edfdf4"/>
      <stop offset="100%" stop-color="#e1f2e8"/>
    </linearGradient>
    <filter id="shadowE3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#101e19" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="320" height="200" rx="16" fill="url(#bgGradE3)"/>

  <!-- Silla o apoyo pélvico -->
  <line x1="100" y1="145" x2="200" y2="145" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="145" y1="145" x2="145" y2="185" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

  <!-- Muslos y rodillas a 90 grados bien apoyados -->
  <path d="M145 142 L205 142 L210 185" fill="none" stroke="#25332d" stroke-width="12" stroke-linecap="round"/>

  <!-- Columna en extensión suave y controlada (apertura torácica anterior) -->
  <path d="M140 142 C132 120 135 95 148 72" stroke="#25332d" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Cadena anterior (Psoas y zona lumbar) en verde descompresión -->
  <path d="M142 135 Q135 115 145 85" fill="none" stroke="#00664b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="138" cy="115" r="3" fill="#85d7b5"/>

  <!-- Cabeza erguida con barbilla neutral (mirada al frente/arriba sin colapso cervical) -->
  <ellipse cx="156" cy="56" rx="16" ry="19" fill="#101e19" filter="url(#shadowE3)"/>

  <!-- Manos apoyadas en la parte posterior de la pelvis (sacro) para soporte biomecánico -->
  <path d="M142 90 L125 105 L132 132" fill="none" stroke="#2a7f62" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="132" cy="132" r="5" fill="#00664b"/>

  <!-- Codos llevados hacia atrás para expandir el pecho -->
  <path d="M125 105 L110 115" stroke="#386286" stroke-width="4" stroke-linecap="round"/>

  <!-- Flecha de apertura y extensión lumbar asistida -->
  <path d="M125 75 Q145 60 165 70" fill="none" stroke="#ac5d00" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,2"/>
  <polygon points="163,65 170,71 163,77" fill="#ac5d00"/>
  <text x="180" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#ac5d00">Extensión</text>

  <!-- Badges clínicos -->
  <g transform="translate(18, 18)">
    <rect width="144" height="24" rx="12" fill="#ffffff" opacity="0.95" filter="url(#shadowE3)"/>
    <circle cx="14" cy="12" r="5" fill="#00664b"/>
    <text x="25" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#00664b">Apertura Flexores Cadera</text>
  </g>

  <g transform="translate(165, 162)">
    <rect width="140" height="22" rx="11" fill="#ac5d00" opacity="0.95"/>
    <text x="70" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Manos en el sacro de apoyo</text>
  </g>
</svg>
