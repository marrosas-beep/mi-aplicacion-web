<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradC2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="shadowC2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7f1d1d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    @keyframes animChinTuck {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(-16px); }
    }
    @keyframes animArrowPulse {
      0%, 100% { opacity: 0.4; transform: translateX(0px); }
      50% { opacity: 1; transform: translateX(-6px); }
    }
    .head-retract {
      animation: animChinTuck 3s ease-in-out infinite;
    }
    .arrow-retract {
      animation: animArrowPulse 3s ease-in-out infinite;
    }
  </style>

  <rect width="320" height="200" rx="16" fill="url(#bgGradC2)"/>
  
  <!-- Eje horizontal guía -->
  <line x1="40" y1="90" x2="280" y2="90" stroke="#fca5a5" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="160" y1="20" x2="160" y2="180" stroke="#fca5a5" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- Columna torácica alineada de perfil -->
  <path d="M120 180 C135 155 138 125 140 100" fill="none" stroke="#450a0a" stroke-width="14" stroke-linecap="round"/>

  <!-- Posición adelantada previa (fantasma tenue) -->
  <path d="M140 100 Q160 85 185 80" fill="none" stroke="#fca5a5" stroke-width="8" stroke-linecap="round" stroke-dasharray="4,4"/>
  <ellipse cx="195" cy="65" rx="18" ry="22" fill="#fca5a5" opacity="0.35"/>

  <!-- Cabeza y cuello animados con retracción horizontal pura (Chin Tuck) -->
  <g class="head-retract">
    <!-- Cuello corregido hacia atrás -->
    <path d="M140 100 Q152 82 165 70" fill="none" stroke="#dc2626" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Cabeza en perfil mirando a la derecha -->
    <g transform="translate(145, 42)" filter="url(#shadowC2)">
      <ellipse cx="20" cy="22" rx="22" ry="25" fill="#1c1917"/>
      <!-- Nariz y mentón -->
      <path d="M38 18 L46 22 L38 27 L39 34 L31 38" fill="none" stroke="#1c1917" stroke-width="4" stroke-linecap="round"/>
      <!-- Mentón guardado (doble mentón) -->
      <path d="M30 38 Q22 41 15 36" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Punto de descompresión C5-C7 -->
    <circle cx="152" cy="85" r="5" fill="#ef4444"/>
    <circle cx="152" cy="85" r="9" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="2,2"/>
  </g>

  <!-- Flecha horizontal indicadora animada -->
  <g class="arrow-retract" transform="translate(190, 48)">
    <line x1="45" y1="20" x2="10" y2="20" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <polygon points="10,14 0,20 10,26" fill="#dc2626"/>
    <text x="25" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">Hacia Atrás</text>
  </g>

  <!-- Badges clínicos -->
  <g transform="translate(16, 16)">
    <rect width="138" height="24" rx="12" fill="#ffffff" opacity="0.96" filter="url(#shadowC2)"/>
    <circle cx="14" cy="12" r="5" fill="#dc2626"/>
    <text x="25" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Retracción C5-C7</text>
  </g>

  <g transform="translate(170, 162)">
    <rect width="135" height="22" rx="11" fill="#dc2626" opacity="0.95"/>
    <text x="67" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Animación: Doble Mentón</text>
  </g>
</svg>
