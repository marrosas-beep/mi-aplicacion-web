<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edfdf4"/>
      <stop offset="100%" stop-color="#e1f2e8"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#101e19" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="320" height="200" rx="16" fill="url(#bgGrad2)"/>
  
  <!-- Cuadrícula sutil de eje horizontal -->
  <line x1="40" y1="90" x2="280" y2="90" stroke="#bec9c2" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="160" y1="20" x2="160" y2="180" stroke="#bec9c2" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>

  <!-- Perfil de columna torácica alineada -->
  <path d="M120 180 C135 155 138 125 140 100" fill="none" stroke="#25332d" stroke-width="14" stroke-linecap="round"/>

  <!-- Posición adelantada anterior (fantasma / previa) -->
  <path d="M140 100 Q160 85 185 80" fill="none" stroke="#bec9c2" stroke-width="8" stroke-linecap="round" stroke-dasharray="4,4"/>
  <ellipse cx="200" cy="65" rx="18" ry="22" fill="#bec9c2" opacity="0.3"/>

  <!-- Columna cervical corregida / retraída hacia atrás -->
  <path d="M140 100 Q142 80 148 70" fill="none" stroke="#00664b" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Cabeza en posición neutra y retraída (perfil lateral mirando a la derecha) -->
  <g transform="translate(145, 42)" filter="url(#shadow2)">
    <!-- Cabeza -->
    <ellipse cx="20" cy="22" rx="22" ry="25" fill="#101e19"/>
    <!-- Nariz y mentón alineados -->
    <path d="M38 18 L46 22 L38 27 L39 34 L31 38" fill="none" stroke="#101e19" stroke-width="4" stroke-linecap="round"/>
    <!-- Mentón guardado (doble mentón sutil) -->
    <path d="M30 38 Q22 41 15 36" fill="none" stroke="#ac5d00" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Flecha horizontal de retracción hacia atrás -->
  <g transform="translate(130, 48)">
    <line x1="75" y1="20" x2="35" y2="20" stroke="#ac5d00" stroke-width="3" stroke-linecap="round"/>
    <polygon points="35,14 25,20 35,26" fill="#ac5d00"/>
    <text x="55" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#ac5d00" text-anchor="middle">Horizontal</text>
  </g>

  <!-- Alivio en la base del cráneo (C5-C7) -->
  <circle cx="140" cy="85" r="5" fill="#85d7b5"/>
  <circle cx="140" cy="85" r="9" fill="none" stroke="#00664b" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- Badges clínicos -->
  <g transform="translate(18, 18)">
    <rect width="130" height="24" rx="12" fill="#ffffff" opacity="0.95" filter="url(#shadow2)"/>
    <circle cx="14" cy="12" r="5" fill="#00664b"/>
    <text x="25" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#00664b">Descompresión C5-C7</text>
  </g>

  <g transform="translate(180, 162)">
    <rect width="124" height="22" rx="11" fill="#00664b" opacity="0.9"/>
    <text x="62" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Sin inclinar hacia abajo</text>
  </g>
</svg>
