<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradE1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="shadowE1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7f1d1d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    @keyframes animPelvicTilt {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg); }
    }
    .pelvis-animated {
      transform-origin: 140px 140px;
      animation: animPelvicTilt 3.5s ease-in-out infinite;
    }
  </style>

  <rect width="320" height="200" rx="16" fill="url(#bgGradE1)"/>
  
  <!-- Silla de oficina -->
  <line x1="85" y1="140" x2="195" y2="140" stroke="#991b1b" stroke-width="5" stroke-linecap="round"/>
  <line x1="88" y1="65" x2="98" y2="135" stroke="#991b1b" stroke-width="5" stroke-linecap="round"/>
  <line x1="140" y1="142" x2="140" y2="185" stroke="#7f1d1d" stroke-width="5" stroke-linecap="round"/>
  <line x1="115" y1="185" x2="165" y2="185" stroke="#7f1d1d" stroke-width="5" stroke-linecap="round"/>

  <!-- Muslos y rodillas a 90 grados -->
  <path d="M140 137 L205 137 L210 180" fill="none" stroke="#450a0a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="202" y1="182" x2="225" y2="182" stroke="#1c1917" stroke-width="5" stroke-linecap="round"/>

  <!-- Tronco y Columna con animación de báscula pélvica rítmica -->
  <g class="pelvis-animated">
    <path d="M138 135 C146 112 136 88 142 70" fill="none" stroke="#450a0a" stroke-width="13" stroke-linecap="round"/>

    <!-- Discos L4-L5 y L5-S1 en rojo brillante de hidratación -->
    <circle cx="140" cy="120" r="5.5" fill="#dc2626"/>
    <circle cx="140" cy="120" r="8.5" fill="none" stroke="#ef4444" stroke-width="2"/>
    <circle cx="138" cy="130" r="5.5" fill="#dc2626"/>

    <!-- Cabeza erguida neutra -->
    <ellipse cx="145" cy="52" rx="16" ry="19" fill="#1c1917" filter="url(#shadowE1)"/>

    <!-- Manos en muslos -->
    <path d="M135 85 L165 110 L185 132" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
    <circle cx="185" cy="132" r="4.5" fill="#991b1b"/>
  </g>

  <!-- Flechas curvas indicadoras de báscula pélvica -->
  <g transform="translate(100, 122)">
    <path d="M5 22 C-5 6 5 -8 20 -6" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="20,-10 25,-5 19,-2" fill="#dc2626"/>
    <polygon points="5,25 0,20 6,17" fill="#dc2626"/>
    <text x="-12" y="8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#991b1b">Báscula</text>
  </g>

  <!-- Badges clínicos -->
  <g transform="translate(16, 16)">
    <rect width="144" height="24" rx="12" fill="#ffffff" opacity="0.96" filter="url(#shadowE1)"/>
    <circle cx="14" cy="12" r="5" fill="#dc2626"/>
    <text x="25" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Descompresión L4-S1</text>
  </g>

  <g transform="translate(168, 162)">
    <rect width="138" height="22" rx="11" fill="#dc2626" opacity="0.95"/>
    <text x="69" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Animación: Curvar y Arquear</text>
  </g>
</svg>
