<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradE2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edfdf4"/>
      <stop offset="100%" stop-color="#e1f2e8"/>
    </linearGradient>
    <filter id="shadowE2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#101e19" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="320" height="200" rx="16" fill="url(#bgGradE2)"/>

  <!-- Silla con respaldo vertical para fijar el giro -->
  <line x1="110" y1="145" x2="210" y2="145" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="105" y1="65" x2="105" y2="145" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>

  <!-- Pelvis y caderas orientadas al frente (fijación biomecánica) -->
  <ellipse cx="160" cy="142" rx="28" ry="12" fill="#25332d"/>
  <rect x="138" y="142" width="44" height="38" rx="6" fill="#25332d"/>

  <!-- Tronco girado hacia la izquierda tomando el respaldo -->
  <path d="M140 140 C135 115 142 95 158 92" stroke="#25332d" stroke-width="14" stroke-linecap="round"/>

  <!-- Columna torácica en rotación armónica destacada en verde clínico -->
  <path d="M155 130 Q145 110 152 92" fill="none" stroke="#00664b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="150" cy="110" r="3" fill="#85d7b5"/>

  <!-- Cabeza mirando por encima del hombro izquierdo -->
  <ellipse cx="152" cy="62" rx="16" ry="20" transform="rotate(-15 152 62)" fill="#101e19" filter="url(#shadowE2)"/>

  <!-- Brazo izquierdo tomando el respaldo de la silla -->
  <path d="M145 92 L112 85" stroke="#386286" stroke-width="6" stroke-linecap="round"/>
  <circle cx="107" cy="85" r="5" fill="#386286"/>

  <!-- Brazo derecho cruzando hacia el muslo izquierdo para hacer palanca suave -->
  <path d="M168 95 L145 125 L135 140" stroke="#2a7f62" stroke-width="5" stroke-linecap="round"/>
  <circle cx="135" cy="140" r="4" fill="#00664b"/>

  <!-- Flecha curva de rotación torácica pura -->
  <path d="M195 90 C185 70 145 70 120 78" fill="none" stroke="#ac5d00" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,2"/>
  <polygon points="118,74 112,80 120,84" fill="#ac5d00"/>
  <text x="175" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#ac5d00">Torsión Torácica</text>

  <!-- Badges clínicos -->
  <g transform="translate(18, 18)">
    <rect width="138" height="24" rx="12" fill="#ffffff" opacity="0.95" filter="url(#shadowE2)"/>
    <circle cx="14" cy="12" r="5" fill="#00664b"/>
    <text x="25" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#00664b">Rotación Torácica</text>
  </g>

  <g transform="translate(170, 162)">
    <rect width="135" height="22" rx="11" fill="#00664b" opacity="0.95"/>
    <text x="67" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Caderas 100% fijas</text>
  </g>
</svg>
