<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradE2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="shadowE2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7f1d1d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    @keyframes animThoracicTwist {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-10deg); }
    }
    .trunk-twist {
      transform-origin: 155px 140px;
      animation: animThoracicTwist 4s ease-in-out infinite;
    }
  </style>

  <rect width="320" height="200" rx="16" fill="url(#bgGradE2)"/>

  <!-- Silla con respaldo vertical fijado -->
  <line x1="110" y1="145" x2="210" y2="145" stroke="#991b1b" stroke-width="5" stroke-linecap="round"/>
  <line x1="105" y1="65" x2="105" y2="145" stroke="#7f1d1d" stroke-width="6" stroke-linecap="round"/>

  <!-- Pelvis y caderas fijas al frente -->
  <ellipse cx="160" cy="142" rx="28" ry="12" fill="#450a0a"/>
  <rect x="138" y="142" width="44" height="38" rx="6" fill="#450a0a"/>

  <!-- Tronco en torsión torácica armónica animada -->
  <g class="trunk-twist">
    <path d="M140 140 C135 115 142 95 158 92" stroke="#450a0a" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Columna torácica en rojo clínico -->
    <path d="M155 130 Q145 110 152 92" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
    <circle cx="150" cy="110" r="3.5" fill="#fca5a5"/>

    <!-- Cabeza girada mirando por encima del hombro -->
    <ellipse cx="152" cy="62" rx="16" ry="20" transform="rotate(-15 152 62)" fill="#1c1917" filter="url(#shadowE2)"/>

    <!-- Brazo izquierdo tomando el respaldo -->
    <path d="M145 92 L112 85" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
    <circle cx="107" cy="85" r="5" fill="#991b1b"/>

    <!-- Brazo derecho asistiendo en muslo opuesto -->
    <path d="M168 95 L145 125 L135 140" stroke="#b91c1c" stroke-width="5" stroke-linecap="round"/>
    <circle cx="135" cy="140" r="4" fill="#7f1d1d"/>
  </g>

  <!-- Flecha curva de rotación torácica pura -->
  <path d="M195 85 C185 65 145 65 120 74" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,2"/>
  <polygon points="118,70 112,76 120,80" fill="#dc2626"/>

  <!-- Badges clínicos -->
  <g transform="translate(16, 16)">
    <rect width="144" height="24" rx="12" fill="#ffffff" opacity="0.96" filter="url(#shadowE2)"/>
    <circle cx="14" cy="12" r="5" fill="#dc2626"/>
    <text x="25" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Rotación Torácica</text>
  </g>

  <g transform="translate(168, 162)">
    <rect width="138" height="22" rx="11" fill="#dc2626" opacity="0.95"/>
    <text x="69" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Animación: Torsión en Silla</text>
  </g>
</svg>
