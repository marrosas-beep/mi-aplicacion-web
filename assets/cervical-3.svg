<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradC3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="shadowC3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7f1d1d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    @keyframes animAxialRotate {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(24deg); }
      75% { transform: rotate(-24deg); }
    }
    .head-rotate {
      transform-origin: 160px 65px;
      animation: animAxialRotate 4.5s ease-in-out infinite;
    }
  </style>

  <rect width="320" height="200" rx="16" fill="url(#bgGradC3)"/>
  
  <!-- Eje vertical puro de rotación -->
  <line x1="160" y1="15" x2="160" y2="185" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Hombros nivelados y estables -->
  <path d="M100 135 C110 110 135 105 160 105 C185 105 210 110 220 135 Z" fill="#450a0a"/>
  <!-- Anclas fijas en hombros -->
  <circle cx="106" cy="120" r="7" fill="#dc2626"/>
  <circle cx="214" cy="120" r="7" fill="#dc2626"/>

  <!-- Tronco sentado -->
  <path d="M125 135 L125 175 L195 175 L195 135 Z" fill="#450a0a" opacity="0.9"/>

  <!-- Cuello centrado -->
  <rect x="151" y="80" width="18" height="26" rx="4" fill="#1c1917"/>

  <!-- Cabeza animada girando rítmicamente de lado a lado -->
  <g class="head-rotate">
    <ellipse cx="160" cy="55" rx="20" ry="24" fill="#1c1917" filter="url(#shadowC3)"/>
    <!-- Nariz señalando el giro -->
    <path d="M168 52 Q180 55 170 60" fill="none" stroke="#1c1917" stroke-width="4" stroke-linecap="round"/>
    <!-- Orejas -->
    <ellipse cx="142" cy="56" rx="3.5" ry="6" fill="#fca5a5"/>
    <ellipse cx="178" cy="56" rx="3.5" ry="6" fill="#fca5a5"/>
    <!-- Esternocleidomastoideo resaltado en rojo clínico -->
    <path d="M152 68 Q162 80 166 94" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Flecha curva indicadora de giro bilateral -->
  <path d="M110 45 C125 24 195 24 210 45" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,2"/>
  <polygon points="214,43 213,53 205,47" fill="#dc2626"/>
  <polygon points="106,43 107,53 115,47" fill="#dc2626"/>

  <!-- Badges clínicos -->
  <g transform="translate(16, 16)">
    <rect width="134" height="24" rx="12" fill="#ffffff" opacity="0.96" filter="url(#shadowC3)"/>
    <circle cx="14" cy="12" r="5" fill="#dc2626"/>
    <text x="25" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Rotación Bilateral</text>
  </g>

  <g transform="translate(168, 162)">
    <rect width="136" height="22" rx="11" fill="#dc2626" opacity="0.95"/>
    <text x="68" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Animación: Giro Suave</text>
  </g>
</svg>
