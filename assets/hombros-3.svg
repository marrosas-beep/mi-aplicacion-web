<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradH3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="shadowH3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7f1d1d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    @keyframes animCrossArm {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(-14px); }
    }
    .cross-arm {
      animation: animCrossArm 3.5s ease-in-out infinite;
    }
  </style>

  <rect width="320" height="200" rx="16" fill="url(#bgGradH3)"/>

  <!-- Tronco de frente -->
  <path d="M125 155 C125 105 135 90 160 90 C185 90 195 105 195 155 Z" fill="#450a0a"/>

  <!-- Cuello y cabeza alineada -->
  <rect x="151" y="70" width="18" height="25" rx="3" fill="#1c1917"/>
  <ellipse cx="160" cy="52" rx="18" ry="22" fill="#1c1917" filter="url(#shadowH3)"/>

  <!-- Hombro izquierdo pasivo -->
  <circle cx="120" cy="105" r="12" fill="#450a0a"/>

  <!-- Brazo derecho cruzando horizontalmente por delante del pecho (animado) -->
  <g class="cross-arm">
    <!-- Hombro derecho elongado (deltoides posterior) -->
    <circle cx="200" cy="105" r="14" fill="#dc2626"/>
    <!-- Brazo cruzando hacia la izquierda -->
    <path d="M195 105 L115 105" stroke="#dc2626" stroke-width="12" stroke-linecap="round"/>
    <circle cx="115" cy="105" r="6" fill="#b91c1c"/>

    <!-- Mano izquierda enganchando el codo y tirando hacia el cuerpo -->
    <path d="M120 135 L125 105 Q125 90 135 90" fill="none" stroke="#991b1b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="135" cy="90" r="4.5" fill="#7f1d1d"/>

    <!-- Flecha de tracción medial -->
    <line x1="170" y1="88" x2="135" y2="88" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="135,84 128,88 135,92" fill="#dc2626"/>
  </g>

  <!-- Badges clínicos -->
  <g transform="translate(16, 16)">
    <rect width="144" height="24" rx="12" fill="#ffffff" opacity="0.96" filter="url(#shadowH3)"/>
    <circle cx="14" cy="12" r="5" fill="#dc2626"/>
    <text x="25" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Deltoides Posterior</text>
  </g>

  <g transform="translate(168, 162)">
    <rect width="138" height="22" rx="11" fill="#dc2626" opacity="0.95"/>
    <text x="69" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Animación: Brazo Cruzado</text>
  </g>
</svg>
