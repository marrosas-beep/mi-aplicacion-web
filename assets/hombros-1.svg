<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradH1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edfdf4"/>
      <stop offset="100%" stop-color="#e1f2e8"/>
    </linearGradient>
    <filter id="shadowH1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#101e19" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="320" height="200" rx="16" fill="url(#bgGradH1)"/>
  
  <!-- Espaldar de la silla -->
  <line x1="160" y1="125" x2="160" y2="185" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="100" y1="160" x2="220" y2="160" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

  <!-- Tronco visto desde atrás / tres cuartos -->
  <path d="M125 155 C125 115 135 95 160 95 C185 95 195 115 195 155 Z" fill="#25332d"/>

  <!-- Cuello y cabeza alineada erguida -->
  <rect x="152" y="70" width="16" height="26" rx="4" fill="#101e19"/>
  <ellipse cx="160" cy="54" rx="18" ry="22" fill="#101e19" filter="url(#shadowH1)"/>

  <!-- Brazos: Manos detrás de la cabeza, codos abiertos hacia los lados/atrás -->
  <!-- Brazo Izquierdo -->
  <path d="M135 100 L85 85 Q80 82 86 76 L144 58" fill="none" stroke="#386286" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="84" cy="80" r="6" fill="#386286"/>

  <!-- Brazo Derecho -->
  <path d="M185 100 L235 85 Q240 82 234 76 L176 58" fill="none" stroke="#386286" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="236" cy="80" r="6" fill="#386286"/>

  <!-- Zona interescapular activada (Romboides y trapecio medio) -->
  <g transform="translate(145, 105)">
    <path d="M5 0 Q15 12 5 28" fill="none" stroke="#00664b" stroke-width="4" stroke-linecap="round"/>
    <path d="M25 0 Q15 12 25 28" fill="none" stroke="#00664b" stroke-width="4" stroke-linecap="round"/>
    <!-- Flechas convergiendo hacia el centro (juntar escápulas) -->
    <path d="M-2 14 L8 14" stroke="#ac5d00" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="8,11 14,14 8,17" fill="#ac5d00"/>
    <path d="M32 14 L22 14" stroke="#ac5d00" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="22,11 16,14 22,17" fill="#ac5d00"/>
  </g>

  <!-- Flechas de apertura de codos hacia atrás -->
  <path d="M68 85 Q62 70 75 60" fill="none" stroke="#ac5d00" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,2"/>
  <polygon points="73,56 81,60 74,66" fill="#ac5d00"/>

  <path d="M252 85 Q258 70 245 60" fill="none" stroke="#ac5d00" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,2"/>
  <polygon points="247,56 239,60 246,66" fill="#ac5d00"/>

  <!-- Badges clínicos -->
  <g transform="translate(18, 18)">
    <rect width="138" height="24" rx="12" fill="#ffffff" opacity="0.95" filter="url(#shadowH1)"/>
    <circle cx="14" cy="12" r="5" fill="#386286"/>
    <text x="25" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#386286">Apertura Pectoral</text>
  </g>

  <g transform="translate(175, 162)">
    <rect width="130" height="22" rx="11" fill="#386286" opacity="0.95"/>
    <text x="65" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Junta los omóplatos</text>
  </g>
</svg>
