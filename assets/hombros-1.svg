<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradH1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="shadowH1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7f1d1d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    @keyframes animChestOpen {
      0%, 100% { transform: scaleX(1); }
      50% { transform: scaleX(1.15); }
    }
    @keyframes animScapula {
      0%, 100% { transform: scale(0.9); }
      50% { transform: scale(1.1); }
    }
    .arms-animated {
      transform-origin: 160px 85px;
      animation: animChestOpen 3.5s ease-in-out infinite;
    }
    .scapula-glow {
      transform-origin: 160px 115px;
      animation: animScapula 3.5s ease-in-out infinite;
    }
  </style>

  <rect width="320" height="200" rx="16" fill="url(#bgGradH1)"/>
  
  <!-- Espaldar de la silla -->
  <line x1="160" y1="125" x2="160" y2="185" stroke="#991b1b" stroke-width="5" stroke-linecap="round"/>
  <line x1="100" y1="160" x2="220" y2="160" stroke="#991b1b" stroke-width="5" stroke-linecap="round"/>

  <!-- Tronco visto desde atrás -->
  <path d="M125 155 C125 115 135 95 160 95 C185 95 195 115 195 155 Z" fill="#450a0a"/>

  <!-- Cuello y cabeza alineada erguida -->
  <rect x="152" y="70" width="16" height="26" rx="4" fill="#1c1917"/>
  <ellipse cx="160" cy="54" rx="18" ry="22" fill="#1c1917" filter="url(#shadowH1)"/>

  <!-- Brazos animados abriendo hacia atrás -->
  <g class="arms-animated">
    <!-- Brazo Izquierdo -->
    <path d="M135 100 L85 85 Q78 80 84 74 L144 56" fill="none" stroke="#dc2626" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="82" cy="78" r="6" fill="#b91c1c"/>

    <!-- Brazo Derecho -->
    <path d="M185 100 L235 85 Q242 80 236 74 L176 56" fill="none" stroke="#dc2626" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="238" cy="78" r="6" fill="#b91c1c"/>
  </g>

  <!-- Zona interescapular animada (Romboides juntándose) -->
  <g class="scapula-glow" transform="translate(145, 105)">
    <path d="M5 0 Q15 12 5 28" fill="none" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M25 0 Q15 12 25 28" fill="none" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Flechas convergentes hacia el centro -->
    <path d="M-2 14 L8 14" stroke="#991b1b" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="8,11 14,14 8,17" fill="#991b1b"/>
    <path d="M32 14 L22 14" stroke="#991b1b" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="22,11 16,14 22,17" fill="#991b1b"/>
  </g>

  <!-- Badges clínicos en rojo -->
  <g transform="translate(16, 16)">
    <rect width="138" height="24" rx="12" fill="#ffffff" opacity="0.96" filter="url(#shadowH1)"/>
    <circle cx="14" cy="12" r="5" fill="#dc2626"/>
    <text x="25" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Apertura Pectoral</text>
  </g>

  <g transform="translate(170, 162)">
    <rect width="135" height="22" rx="11" fill="#dc2626" opacity="0.95"/>
    <text x="67" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Animación: Codos Atrás</text>
  </g>
</svg>
