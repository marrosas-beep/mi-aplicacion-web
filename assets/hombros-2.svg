<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradH2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="shadowH2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7f1d1d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    @keyframes animShoulderShrug {
      0%, 100% { transform: translateY(0px); }
      40%, 65% { transform: translateY(-16px); }
      75% { transform: translateY(2px); }
    }
    .shoulders-shrug {
      animation: animShoulderShrug 4s ease-in-out infinite;
    }
  </style>

  <rect width="320" height="200" rx="16" fill="url(#bgGradH2)"/>

  <!-- Línea base de reposo de hombros -->
  <line x1="80" y1="120" x2="240" y2="120" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <text x="50" y="123" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#991b1b">Reposo</text>

  <!-- Tronco erguido -->
  <path d="M125 155 C125 105 135 90 160 90 C185 90 195 105 195 155 Z" fill="#450a0a"/>

  <!-- Cuello centrado -->
  <rect x="151" y="70" width="18" height="25" rx="3" fill="#1c1917"/>
  <!-- Cabeza erguida frontal -->
  <ellipse cx="160" cy="52" rx="18" ry="22" fill="#1c1917" filter="url(#shadowH2)"/>

  <!-- Hombros animados: suben hacia las orejas y bajan de golpe -->
  <g class="shoulders-shrug">
    <!-- Hombro Izquierdo -->
    <ellipse cx="120" cy="105" rx="15" ry="12" fill="#dc2626"/>
    <path d="M120 105 L105 145" stroke="#450a0a" stroke-width="8" stroke-linecap="round"/>

    <!-- Hombro Derecho -->
    <ellipse cx="200" cy="105" rx="15" ry="12" fill="#dc2626"/>
    <path d="M200 105 L215 145" stroke="#450a0a" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Flechas duales: Inhala arriba y suelta abajo -->
  <g transform="translate(85, 78)">
    <line x1="0" y1="35" x2="0" y2="5" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="-4,6 0,0 4,6" fill="#dc2626"/>
    <text x="-8" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#991b1b" text-anchor="end">1. Inhala</text>
  </g>

  <g transform="translate(235, 78)">
    <line x1="0" y1="5" x2="0" y2="35" stroke="#991b1b" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="-4,34 0,40 4,34" fill="#991b1b"/>
    <text x="8" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#991b1b">2. Suelta</text>
  </g>

  <!-- Badges clínicos -->
  <g transform="translate(16, 16)">
    <rect width="144" height="24" rx="12" fill="#ffffff" opacity="0.96" filter="url(#shadowH2)"/>
    <circle cx="14" cy="12" r="5" fill="#dc2626"/>
    <text x="25" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Descarga Escapular</text>
  </g>

  <g transform="translate(170, 162)">
    <rect width="135" height="22" rx="11" fill="#dc2626" opacity="0.95"/>
    <text x="67" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Animación: Elevar y Soltar</text>
  </g>
</svg>
