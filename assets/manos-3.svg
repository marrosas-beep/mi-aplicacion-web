<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradM3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="shadowM3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7f1d1d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    @keyframes animUlnarDev {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(18deg); }
    }
    .ulnar-fist {
      transform-origin: 200px 100px;
      animation: animUlnarDev 3s ease-in-out infinite;
    }
  </style>

  <rect width="320" height="200" rx="16" fill="url(#bgGradM3)"/>

  <!-- Antebrazo neutro (pulgar hacia arriba) -->
  <path d="M70 100 L200 100" stroke="#450a0a" stroke-width="16" stroke-linecap="round"/>
  
  <!-- Tendón del abductor largo y extensor corto del pulgar (De Quervain) -->
  <line x1="140" y1="92" x2="205" y2="92" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <circle cx="195" cy="92" r="4" fill="#ef4444"/>

  <!-- Puño con pulgar atrapado adentro (Maniobra de Finkelstein terapéutica suave) -->
  <g class="ulnar-fist">
    <!-- Mano cerrada en puño -->
    <rect x="200" y="85" width="38" height="30" rx="8" fill="#1c1917" filter="url(#shadowM3)"/>
    <!-- Pulgar abrazado por los demás dedos -->
    <path d="M208 92 Q220 92 222 102" fill="none" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Nudillos -->
    <circle cx="234" cy="92" r="3" fill="#fca5a5"/>
    <circle cx="234" cy="100" r="3" fill="#fca5a5"/>
    <circle cx="234" cy="108" r="3" fill="#fca5a5"/>

    <!-- Flecha hacia abajo (desviación ulnar hacia el suelo) -->
    <g transform="translate(245, 115)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="-4,22 0,28 4,22" fill="#dc2626"/>
      <text x="6" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#991b1b">Ulnar</text>
    </g>
  </g>

  <!-- Badges clínicos -->
  <g transform="translate(16, 16)">
    <rect width="150" height="24" rx="12" fill="#ffffff" opacity="0.96" filter="url(#shadowM3)"/>
    <circle cx="14" cy="12" r="5" fill="#dc2626"/>
    <text x="25" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Tendonitis De Quervain</text>
  </g>

  <g transform="translate(168, 162)">
    <rect width="138" height="22" rx="11" fill="#dc2626" opacity="0.95"/>
    <text x="69" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Animación: Pulgar en Puño</text>
  </g>
</svg>
