<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradC1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="shadowC1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7f1d1d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    @keyframes animNeckLateral {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(18deg); }
    }
    @keyframes animHandAssist {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(3px); }
    }
    @keyframes pulseTension {
      0%, 100% { stroke-opacity: 0.4; stroke-width: 4px; }
      50% { stroke-opacity: 1; stroke-width: 6px; }
    }
    .head-animated {
      transform-origin: 160px 85px;
      animation: animNeckLateral 3.5s ease-in-out infinite;
    }
    .hand-assist {
      animation: animHandAssist 3.5s ease-in-out infinite;
    }
    .tension-line {
      animation: pulseTension 3.5s ease-in-out infinite;
    }
  </style>

  <!-- Fondo sereno con acento rojo clínico suave -->
  <rect width="320" height="200" rx="16" fill="url(#bgGradC1)"/>
  
  <!-- Cuadrícula sutil de alineación postural -->
  <line x1="160" y1="20" x2="160" y2="180" stroke="#fca5a5" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="40" y1="150" x2="280" y2="150" stroke="#fca5a5" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- Silla ergonómica de oficina -->
  <path d="M100 130 Q105 70 120 60" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <line x1="90" y1="145" x2="210" y2="145" stroke="#991b1b" stroke-width="6" stroke-linecap="round"/>
  <line x1="150" y1="148" x2="150" y2="185" stroke="#7f1d1d" stroke-width="5" stroke-linecap="round"/>
  <path d="M120 185 L180 185" stroke="#7f1d1d" stroke-width="5" stroke-linecap="round"/>

  <!-- Tronco y postura sentada -->
  <path d="M135 145 C135 120 145 95 160 90 C175 95 185 120 185 145 Z" fill="#450a0a"/>

  <!-- Hombro izquierdo estabilizado (descendido con ancla roja) -->
  <circle cx="135" cy="98" r="9" fill="#dc2626"/>
  <line x1="135" y1="107" x2="135" y2="120" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="131,118 135,125 139,118" fill="#dc2626"/>

  <!-- Hombro derecho -->
  <circle cx="185" cy="95" r="9" fill="#450a0a"/>

  <!-- Zona de estiramiento animada (Trapecio) -->
  <path class="tension-line" d="M136 94 Q150 82 165 74" fill="none" stroke="#b91c1c" stroke-linecap="round"/>

  <!-- Cabeza y cuello animados con inclinación lateral fluida -->
  <g class="head-animated">
    <!-- Cuello -->
    <path d="M157 90 Q168 75 174 68" fill="none" stroke="#450a0a" stroke-width="12" stroke-linecap="round"/>
    <!-- Cabeza -->
    <ellipse cx="178" cy="54" rx="16" ry="20" fill="#1c1917" filter="url(#shadowC1)"/>
    <!-- Oreja -->
    <circle cx="166" cy="54" r="3.5" fill="#fca5a5"/>
    
    <!-- Brazo derecho asistiendo sobre la cabeza -->
    <g class="hand-assist">
      <path d="M185 95 Q212 65 192 42 Q182 36 170 40" fill="none" stroke="#b91c1c" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="170" cy="40" r="4.5" fill="#dc2626"/>
    </g>
  </g>

  <!-- Brazo izquierdo descendido y relajado -->
  <path d="M130 102 L118 140" fill="none" stroke="#450a0a" stroke-width="5" stroke-linecap="round"/>

  <!-- Badges clínicos en rojo -->
  <g transform="translate(16, 16)">
    <rect width="132" height="24" rx="12" fill="#ffffff" opacity="0.96" filter="url(#shadowC1)"/>
    <circle cx="14" cy="12" r="5" fill="#dc2626"/>
    <text x="25" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Trapecio Superior</text>
  </g>

  <g transform="translate(178, 162)">
    <rect width="126" height="22" rx="11" fill="#dc2626" opacity="0.95"/>
    <text x="63" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Animación: Inclinación 30s</text>
  </g>
</svg>
