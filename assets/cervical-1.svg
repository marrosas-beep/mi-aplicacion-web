<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edfdf4"/>
      <stop offset="100%" stop-color="#e1f2e8"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#101e19" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Fondo clínico sereno -->
  <rect width="320" height="200" rx="16" fill="url(#bgGrad1)"/>
  
  <!-- Cuadrícula sutil de alineación postural -->
  <line x1="160" y1="20" x2="160" y2="180" stroke="#bec9c2" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="40" y1="150" x2="280" y2="150" stroke="#bec9c2" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>

  <!-- Silla ergonómica de oficina (respaldo y asiento) -->
  <path d="M100 130 Q105 70 120 60" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="90" y1="145" x2="210" y2="145" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
  <line x1="150" y1="148" x2="150" y2="185" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <path d="M120 185 L180 185" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

  <!-- Tronco y postura sentada -->
  <path d="M135 145 C135 120 145 95 160 90 C175 95 185 120 185 145 Z" fill="#25332d" opacity="0.9"/>

  <!-- Hombro izquierdo estabilizado (descendido) -->
  <circle cx="135" cy="98" r="9" fill="#00664b"/>
  <!-- Hombro derecho -->
  <circle cx="185" cy="95" r="9" fill="#25332d"/>

  <!-- Cuello inclinado hacia la derecha -->
  <path d="M157 90 Q168 75 178 68" fill="none" stroke="#25332d" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Zona de estiramiento en verde terapéutico (Trapecio Izquierdo elongado) -->
  <path d="M136 94 Q150 82 165 74" fill="none" stroke="#00664b" stroke-width="6" stroke-linecap="round"/>
  <circle cx="150" cy="84" r="3" fill="#85d7b5"/>

  <!-- Cabeza con inclinación lateral -->
  <ellipse cx="182" cy="56" rx="16" ry="20" transform="rotate(22 182 56)" fill="#101e19" filter="url(#shadow1)"/>

  <!-- Brazo derecho asistiendo sobre la cabeza suavemente -->
  <path d="M190 98 Q215 70 195 44 Q186 38 174 42" fill="none" stroke="#2a7f62" stroke-width="6" stroke-linecap="round"/>
  <circle cx="173" cy="43" r="5" fill="#00664b"/>

  <!-- Brazo izquierdo descendido y relajado -->
  <path d="M130 102 L118 140" fill="none" stroke="#25332d" stroke-width="5" stroke-linecap="round"/>

  <!-- Flecha de movimiento suave / gravedad -->
  <path d="M165 42 Q180 32 195 40" fill="none" stroke="#ac5d00" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,2"/>
  <polygon points="195,36 202,41 193,45" fill="#ac5d00"/>

  <!-- Badge / Etiqueta médica en el gráfico -->
  <g transform="translate(18, 18)">
    <rect width="115" height="24" rx="12" fill="#ffffff" opacity="0.95" filter="url(#shadow1)"/>
    <circle cx="14" cy="12" r="5" fill="#00664b"/>
    <text x="25" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#00664b">Trapecio Superior</text>
  </g>

  <g transform="translate(205, 162)">
    <rect width="98" height="22" rx="11" fill="#ac5d00" opacity="0.9"/>
    <text x="49" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Solo peso del brazo</text>
  </g>
</svg>
